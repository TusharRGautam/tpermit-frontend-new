<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Path for circular text -->
    <path id="veloxTopArc" d="M 45, 160 A 115, 115 0 0, 1 275, 160" fill="none" />
    <path id="veloxBottomArc" d="M 275, 160 A 115, 115 0 0, 1 45, 160" fill="none" />
    <!-- Filter for subtle ink stamp grunge effect -->
    <filter id="stampRoughness" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Stamp Group with Violet Ink Color -->
  <g transform="rotate(-6 160 160)" filter="url(#stampRoughness)">
    <!-- Outer Double Border -->
    <circle cx="160" cy="160" r="130" stroke="#4a3780" stroke-width="4" fill="none" opacity="0.85" stroke-dasharray="120 2 90 2" />
    <circle cx="160" cy="160" r="121" stroke="#4a3780" stroke-width="1.6" fill="none" opacity="0.80" />
    
    <!-- Inner Circle -->
    <circle cx="160" cy="160" r="82" stroke="#4a3780" stroke-width="1.8" fill="none" opacity="0.78" stroke-dasharray="80 1 60 1" />

    <!-- Top Text along Arc: VELOX MOTORS PVT LTD -->
    <text fill="#4a3780" font-family="'Arial', 'Helvetica', sans-serif" font-size="19" font-weight="900" letter-spacing="4.5" opacity="0.88">
      <textPath href="#veloxTopArc" startOffset="50%" text-anchor="middle">
        VELOX MOTORS
      </textPath>
    </text>

    <!-- Bottom Text along Arc: PVT. LTD. & Stars -->
    <text fill="#4a3780" font-family="'Arial', 'Helvetica', sans-serif" font-size="16" font-weight="900" letter-spacing="4" opacity="0.85">
      <textPath href="#veloxBottomArc" startOffset="50%" text-anchor="middle">
        * PVT. LTD. *
      </textPath>
    </text>

    <!-- Decorative Stars inside -->
    <text x="160" y="112" font-family="'Arial', sans-serif" font-size="22" font-weight="bold" fill="#4a3780" text-anchor="middle" opacity="0.85">★</text>
  </g>

  <!-- Realistic Cursive Ink Signature Overlapping the Stamp -->
  <g stroke="#1a1c29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.94">
    <!-- Signature Strokes -->
    <path d="M 65 190 Q 95 140 125 185 T 155 160 Q 185 130 195 195" />
    <path d="M 105 170 Q 135 125 155 175 Q 175 205 205 165 Q 235 135 255 170" />
    <path d="M 125 162 L 180 155 Q 215 150 240 162" />
    <path d="M 90 200 Q 145 190 260 182" stroke-width="2.5" />
    <path d="M 140 145 C 160 115 175 120 185 155 C 190 175 200 195 220 175" />
    <path d="M 80 195 Q 110 205 130 195 Q 170 180 230 185" stroke-width="2" />
  </g>
</svg>
